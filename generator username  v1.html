<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Username — Manajemen Pesanan</title>
<style>
  :root{
    --bg:#f4f5fb;
    --card:#ffffff;
    --text:#16182b;
    --muted:#6b7280;
    --border:#e6e8f0;
    --accent:#6366f1;
    --accent-dark:#4f46e5;
    --success:#10b981;
    --warn:#f59e0b;
    --danger:#ef4444;
    --shadow:0 4px 20px rgba(20,25,60,.07);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:24px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1240px;margin:0 auto}

  header{margin-bottom:22px}
  header h1{
    font-size:26px;font-weight:800;letter-spacing:-.5px;
    display:flex;align-items:center;gap:10px;
  }
  header h1 .logo{
    width:40px;height:40px;border-radius:12px;
    background:linear-gradient(135deg,#6366f1,#a855f7);
    display:grid;place-items:center;font-size:20px;
    box-shadow:0 6px 16px rgba(99,102,241,.35);
  }
  header p{color:var(--muted);font-size:14px;margin-top:6px;margin-left:50px}

  .stats{
    display:grid;grid-template-columns:repeat(4,1fr);
    gap:12px;margin-bottom:22px;
  }
  .stat{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden;
  }
  .stat::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
    background:var(--accent);
  }
  .stat.green::before{background:var(--success)}
  .stat.amber::before{background:var(--warn)}
  .stat.red::before{background:var(--danger)}
  .stat .num{font-size:26px;font-weight:800;display:block;line-height:1.1}
  .stat .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

  .grid{display:grid;grid-template-columns:390px 1fr;gap:20px;align-items:start}
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px;
  }
  .card h2{
    font-size:16px;font-weight:700;margin-bottom:18px;
    display:flex;align-items:center;gap:8px;
  }
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

  .field{margin-bottom:14px}
  .field label{
    display:block;font-size:12.5px;font-weight:600;
    color:#414463;margin-bottom:6px;
  }
  .field label .req{color:var(--danger)}
  input,textarea,select{
    width:100%;padding:11px 13px;font-size:14px;
    border:1.5px solid var(--border);border-radius:10px;
    background:#fbfbfe;color:var(--text);
    font-family:inherit;transition:.15s;outline:none;
  }
  input:focus,textarea:focus,select:focus{
    border-color:var(--accent);background:#fff;
    box-shadow:0 0 0 3px rgba(99,102,241,.12);
  }
  textarea{resize:vertical;min-height:60px}
  .input-group{display:flex;gap:8px}
  .input-group input{flex:1}
  .input-group input[type=text]{font-family:'SF Mono',Menlo,Consolas,monospace;font-weight:600;letter-spacing:.5px}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;font-size:14px;font-weight:600;
    border:none;border-radius:10px;cursor:pointer;
    font-family:inherit;transition:.15s;white-space:nowrap;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent);color:#fff;width:100%;box-shadow:0 4px 14px rgba(99,102,241,.3)}
  .btn-primary:hover{background:var(--accent-dark)}
  .btn-ghost{background:#eef0f8;color:#414463}
  .btn-ghost:hover{background:#e3e6f2}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
  .btn-icon{
    padding:0;width:34px;height:34px;border-radius:9px;
    background:#eef0f8;color:#414463;font-size:15px;
  }
  .btn-icon:hover{background:#e3e6f2}
  .btn-danger{background:#fef2f2;color:var(--danger)}
  .btn-danger:hover{background:#fee2e2}

  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* Preview box */
  .preview-box{
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
    border:1.5px dashed #c7d2fe;
    border-radius:12px;padding:16px;text-align:center;
    margin-bottom:16px;
  }
  .preview-box .pv-label{
    font-size:11px;font-weight:700;color:var(--accent);
    text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;
  }
  .preview-box .pv-value{
    font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:26px;font-weight:800;color:var(--accent-dark);
    letter-spacing:1px;
  }
  .preview-box .pv-next{
    font-size:11.5px;color:var(--muted);margin-top:6px;
  }

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .tabs{display:flex;gap:6px;background:#eef0f8;padding:4px;border-radius:11px;flex:1;min-width:220px}
  .tab{
    flex:1;padding:8px 10px;font-size:12.5px;font-weight:600;
    border:none;background:transparent;border-radius:8px;
    cursor:pointer;color:#5a5f7d;font-family:inherit;transition:.15s;
    white-space:nowrap;
  }
  .tab.active{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .search{position:relative;flex:1;min-width:200px}
  .search input{padding-left:36px}
  .search::before{
    content:'🔍';position:absolute;left:12px;top:50%;
    transform:translateY(-50%);font-size:13px;opacity:.55;
  }
  .actions{display:flex;gap:8px}

  .list{display:flex;flex-direction:column;gap:10px;max-height:none}
  .item{
    border:1.5px solid var(--border);border-radius:12px;
    padding:14px 16px;transition:.15s;background:#fff;
  }
  .item:hover{border-color:#cfd3e6;box-shadow:0 4px 14px rgba(20,25,60,.06)}
  .item.is-expired{opacity:.62;background:#fafafc}
  .item-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .uname{
    font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:16px;font-weight:700;letter-spacing:.5px;
    color:var(--accent-dark);word-break:break-all;flex:1;min-width:140px;
  }
  .badge{
    font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:20px;
    text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;
  }
  .badge.active{background:#d1fae5;color:#047857}
  .badge.warn{background:#fef3c7;color:#b45309}
  .badge.expired{background:#fee2e2;color:#b91c1c}
  .item-meta{
    margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;
    font-size:12.5px;color:var(--muted);
  }
  .item-meta b{color:#3c405e;font-weight:600}
  .item-note{
    margin-top:8px;font-size:12.5px;color:#5a5f7d;
    background:#f8f9fd;padding:8px 11px;border-radius:8px;
    border-left:3px solid #d8dcee;
  }
  .item-foot{
    display:flex;gap:7px;margin-top:12px;padding-top:12px;
    border-top:1px dashed var(--border);flex-wrap:wrap;
  }
  .empty{
    text-align:center;padding:50px 20px;color:var(--muted);
  }
  .empty .big{font-size:42px;margin-bottom:12px;opacity:.6}
  .empty p{font-size:13.5px}

  .toast-wrap{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:8px;z-index:999;align-items:center;
  }
  .toast{
    background:#16182b;color:#fff;padding:11px 20px;border-radius:11px;
    font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);
    animation:pop .25s ease;display:flex;align-items:center;gap:8px;
  }
  .toast.ok{background:#065f46}
  .toast.err{background:#991b1b}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

  @media(max-width:900px){
    .grid{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr)}
    body{padding:16px 12px 50px}
    header h1{font-size:21px}
    header p{margin-left:0}
  }
  @media(max-width:480px){
    .stats{gap:8px}
    .stat{padding:12px 14px}
    .stat .num{font-size:21px}
    .card{padding:16px}
    .row-2{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1><span class="logo">🔑</span> Generator Username</h1>
    <p>Username otomatis berurutan (cust001, cust002, ...) — nomor tidak dipakai ulang</p>
  </header>

  <div class="stats">
    <div class="stat"><span class="num" id="statTotal">0</span><span class="lbl">Total Pesanan</span></div>
    <div class="stat green"><span class="num" id="statActive">0</span><span class="lbl">Aktif</span></div>
    <div class="stat amber"><span class="num" id="statWarn">0</span><span class="lbl">Segera Habis</span></div>
    <div class="stat red"><span class="num" id="statExpired">0</span><span class="lbl">Kadaluarsa</span></div>
  </div>

  <div class="grid">

    <!-- ============ FORM ============ -->
    <section class="card">
      <h2><span class="dot"></span> Tambah Pesanan</h2>

      <div class="preview-box">
        <div class="pv-label">Username Berikutnya</div>
        <div class="pv-value" id="previewUsername">cust001</div>
        <div class="pv-next" id="previewInfo">Nomor otomatis — tidak akan terpakai ulang</div>
      </div>

      <form id="orderForm" autocomplete="off">

        <div class="row-2">
          <div class="field">
            <label>Prefix</label>
            <input type="text" id="fPrefix" value="cust" placeholder="cust" maxlength="12">
          </div>
          <div class="field">
            <label>Digit Angka</label>
            <select id="fDigits">
              <option value="3" selected>3 digit (001)</option>
              <option value="4">4 digit (0001)</option>
              <option value="5">5 digit (00001)</option>
              <option value="2">2 digit (01)</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Nama Pelanggan</label>
          <input type="text" id="fCustomer" placeholder="cth: Budi Santoso">
        </div>

        <div class="field">
          <label>No. Pesanan Shopee</label>
          <input type="text" id="fOrder" placeholder="cth: 240612ABCXYZ">
        </div>

        <div class="field">
          <label>Masa Aktif</label>
          <select id="fDuration">
            <option value="1">1 Bulan</option>
            <option value="2">2 Bulan</option>
            <option value="3" selected>3 Bulan</option>
            <option value="6">6 Bulan</option>
            <option value="12">12 Bulan</option>
          </select>
        </div>

        <div class="field">
          <label>Catatan</label>
          <textarea id="fNote" placeholder="cth: paket premium, garansi, dll"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">＋ Simpan &amp; Buat Username Berikutnya</button>
      </form>
    </section>

    <!-- ============ LIST ============ -->
    <section class="card">
      <h2><span class="dot"></span> Daftar Username</h2>

      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all">Semua</button>
          <button class="tab" data-filter="active">Aktif</button>
          <button class="tab" data-filter="warn">Segera Habis</button>
          <button class="tab" data-filter="expired">Kadaluarsa</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">
          <input type="text" id="searchBox" placeholder="Cari username / nama / no. pesanan...">
        </div>
        <div class="actions">
          <button class="btn btn-ghost btn-sm" id="btnExport" title="Export CSV">⬇ CSV</button>
          <button class="btn btn-ghost btn-sm" id="btnBackup" title="Backup JSON">💾</button>
          <button class="btn btn-ghost btn-sm" id="btnRestore" title="Restore JSON">📂</button>
          <input type="file" id="fileInput" accept=".json" hidden>
        </div>
      </div>

      <div class="list" id="list"></div>
    </section>

  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   STATE & STORAGE
   ========================================================= */
const STORAGE_KEY   = 'username_manager_v2';
const COUNTER_KEY   = 'username_counter_v2';   // menyimpan nomor terakhir yang SUDAH dipakai
const SETTINGS_KEY  = 'username_settings_v2';  // prefix & digits terakhir

let data = [];
let counter = 0;         // nomor terakhir yang sudah dipakai (monoton naik)
let currentFilter = 'all';
let searchQuery = '';

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    data = raw ? JSON.parse(raw) : [];
    if(!Array.isArray(data)) data = [];

    counter = parseInt(localStorage.getItem(COUNTER_KEY) || '0', 10) || 0;

    // Migrasi: kalau counter lebih kecil dari nomor tertinggi di data, sinkronkan
    data.forEach(it => {
      const n = extractNumber(it.username);
      if(n && n > counter) counter = n;
    });

    // Load settings
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    if(s.prefix)  document.getElementById('fPrefix').value = s.prefix;
    if(s.digits)  document.getElementById('fDigits').value = s.digits;
  }catch(e){ data = []; counter = 0; }
}

function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    localStorage.setItem(COUNTER_KEY, String(counter));
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      prefix: document.getElementById('fPrefix').value.trim(),
      digits: document.getElementById('fDigits').value
    }));
  }catch(e){ toast('Gagal menyimpan data', 'err'); }
}

/* =========================================================
   HELPERS
   ========================================================= */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function addMonths(date, months){
  const d = new Date(date);
  const day = d.getDate();
  d.setMonth(d.getMonth() + months);
  if(d.getDate() < day) d.setDate(0);
  return d;
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
}
function fmtFull(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}) + ' ' +
         d.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
}
function daysLeft(iso){
  return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000);
}
function getStatus(item){
  const d = daysLeft(item.expiresAt);
  if(d < 0) return 'expired';
  if(d <= 7) return 'warn';
  return 'active';
}
const STATUS_LABEL = {active:'Aktif', warn:'Segera Habis', expired:'Kadaluarsa'};

/* Ambil nomor urut dari string username (angka di akhir) */
function extractNumber(username){
  const m = String(username || '').match(/(\d+)\s*$/);
  return m ? parseInt(m[1], 10) : 0;
}

/* Format username dari prefix + nomor + digit */
function formatUsername(prefix, number, digits){
  const p = (prefix || 'cust').trim().replace(/[^a-zA-Z0-9_-]/g, '') || 'cust';
  return p + String(number).padStart(digits, '0');
}

/* Ambil nomor berikutnya & simpan langsung ke counter (biar tidak dipakai ulang) */
function takeNextNumber(){
  counter += 1;
  localStorage.setItem(COUNTER_KEY, String(counter));
  return counter;
}

/* Preview username berikutnya (tanpa menaikkan counter) */
function peekNextUsername(){
  const prefix = document.getElementById('fPrefix').value.trim() || 'cust';
  const digits = parseInt(document.getElementById('fDigits').value, 10) || 3;
  return formatUsername(prefix, counter + 1, digits);
}

/* =========================================================
   TOAST
   ========================================================= */
function toast(msg, type = ''){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(() => el.remove(), 260);
  }, 2200);
}

/* =========================================================
   COPY
   ========================================================= */
async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    toast('✓ Username disalin: ' + text, 'ok');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('✓ Username disalin', 'ok'); }
    catch(_){ toast('Gagal menyalin', 'err'); }
    ta.remove();
  }
}

/* =========================================================
   PREVIEW UPDATE
   ========================================================= */
function updatePreview(){
  const next = peekNextUsername();
  document.getElementById('previewUsername').textContent = next;
  document.getElementById('previewInfo').textContent =
    'Nomor terakhir terpakai: ' + counter + ' — nomor tidak akan dipakai ulang';
}

/* =========================================================
   RENDER
   ========================================================= */
function render(){
  // ---- Stats ----
  let active = 0, warn = 0, expired = 0;
  data.forEach(it => {
    const s = getStatus(it);
    if(s === 'active') active++;
    else if(s === 'warn') warn++;
    else expired++;
  });
  document.getElementById('statTotal').textContent   = data.length;
  document.getElementById('statActive').textContent  = active;
  document.getElementById('statWarn').textContent    = warn;
  document.getElementById('statExpired').textContent = expired;

  // ---- Filter ----
  let items = data.slice().sort((a, b) => {
    const na = extractNumber(a.username), nb = extractNumber(b.username);
    if(na && nb) return na - nb;
    return new Date(b.createdAt) - new Date(a.createdAt);
  });

  if(currentFilter !== 'all'){
    items = items.filter(it => getStatus(it) === currentFilter);
  }

  if(searchQuery){
    const q = searchQuery.toLowerCase();
    items = items.filter(it =>
      (it.username || '').toLowerCase().includes(q) ||
      (it.customer || '').toLowerCase().includes(q) ||
      (it.orderId  || '').toLowerCase().includes(q) ||
      (it.note     || '').toLowerCase().includes(q)
    );
  }

  // ---- List ----
  const list = document.getElementById('list');
  if(items.length === 0){
    list.innerHTML = `
      <div class="empty">
        <div class="big">${data.length === 0 ? '📦' : '🔍'}</div>
        <p>${data.length === 0
          ? 'Belum ada pesanan. Tambahkan username pertama Anda di form sebelah.'
          : 'Tidak ada data yang cocok dengan filter/pencarian.'}</p>
      </div>`;
    return;
  }

  list.innerHTML = items.map(it => {
    const st = getStatus(it);
    const dl = daysLeft(it.expiresAt);
    let sisaText;
    if(dl < 0) sisaText = `Lewat ${Math.abs(dl)} hari`;
    else if(dl === 0) sisaText = 'Hari ini terakhir';
    else sisaText = `${dl} hari lagi`;

    return `
      <div class="item ${st === 'expired' ? 'is-expired' : ''}">
        <div class="item-top">
          <div class="uname">${esc(it.username)}</div>
          <span class="badge ${st}">${STATUS_LABEL[st]}</span>
        </div>

        <div class="item-meta">
          ${it.customer ? `<span>👤 <b>${esc(it.customer)}</b></span>` : ''}
          ${it.orderId ? `<span>🧾 <b>${esc(it.orderId)}</b></span>` : ''}
          <span>📅 Dibuat <b>${fmtDate(it.createdAt)}</b></span>
          <span>⏳ Berakhir <b>${fmtDate(it.expiresAt)}</b></span>
          <span>⏱️ <b>${sisaText}</b></span>
        </div>

        ${it.note ? `<div class="item-note">📝 ${esc(it.note)}</div>` : ''}

        <div class="item-foot">
          <button class="btn btn-primary btn-sm" style="width:auto" data-copy="${esc(it.username)}">📋 Copy Username</button>
          <button class="btn btn-ghost btn-sm" data-extend="${it.id}">🔄 Perpanjang ${it.durationMonths || 3}bln</button>
          <button class="btn btn-ghost btn-sm" data-edit="${it.id}">✏️ Edit</button>
          <button class="btn btn-danger btn-sm" data-del="${it.id}">🗑 Hapus</button>
        </div>
      </div>
    `;
  }).join('');
}

/* =========================================================
   FORM SUBMIT
   ========================================================= */
document.getElementById('orderForm').addEventListener('submit', e => {
  e.preventDefault();

  const customer = document.getElementById('fCustomer').value.trim();
  const orderId  = document.getElementById('fOrder').value.trim();
  const note     = document.getElementById('fNote').value.trim();
  const duration = parseInt(document.getElementById('fDuration').value, 10) || 3;
  const prefix   = document.getElementById('fPrefix').value.trim() || 'cust';
  const digits   = parseInt(document.getElementById('fDigits').value, 10) || 3;

  // Ambil nomor berikutnya (monoton naik, tidak akan dipakai ulang)
  const num = takeNextNumber();
  const username = formatUsername(prefix, num, digits);

  const now = new Date();
  const item = {
    id: uid(),
    username,
    number: num,
    customer,
    orderId,
    note,
    durationMonths: duration,
    createdAt: now.toISOString(),
    expiresAt: addMonths(now, duration).toISOString()
  };

  data.push(item);
  save();
  render();
  updatePreview();

  // Reset form (prefix & digits tetap)
  document.getElementById('fCustomer').value = '';
  document.getElementById('fOrder').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fDuration').value = '3';
  document.getElementById('fCustomer').focus();

  toast('✓ ' + username + ' dibuat — aktif s/d ' + fmtDate(item.expiresAt), 'ok');
});

/* =========================================================
   SETTINGS CHANGE → update preview
   ========================================================= */
document.getElementById('fPrefix').addEventListener('input', () => {
  updatePreview();
  save();
});
document.getElementById('fDigits').addEventListener('change', () => {
  updatePreview();
  save();
});

/* =========================================================
   LIST ACTIONS
   ========================================================= */
document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn) return;

  if(btn.dataset.copy){
    copyText(btn.dataset.copy);
    return;
  }

  if(btn.dataset.del){
    const it = data.find(x => x.id === btn.dataset.del);
    if(!it) return;
    if(confirm(`Hapus username "${it.username}"?\n\nNomor ${it.number || extractNumber(it.username)} tetap "terpakai" dan tidak akan dibuat ulang.`)){
      data = data.filter(x => x.id !== btn.dataset.del);
      save(); render();
      toast('Data dihapus — nomor tidak akan dipakai ulang');
    }
    return;
  }

  if(btn.dataset.extend){
    const it = data.find(x => x.id === btn.dataset.extend);
    if(!it) return;
    const months = it.durationMonths || 3;
    const base = new Date(it.expiresAt) > new Date() ? new Date(it.expiresAt) : new Date();
    it.expiresAt = addMonths(base, months).toISOString();
    save(); render();
    toast(`✓ Diperpanjang ${months} bulan → ${fmtDate(it.expiresAt)}`, 'ok');
    return;
  }

  if(btn.dataset.edit){
    const it = data.find(x => x.id === btn.dataset.edit);
    if(!it) return;
    const newCust = prompt('Nama Pelanggan:', it.customer || '');
    if(newCust === null) return;
    const newOrder = prompt('No. Pesanan:', it.orderId || '');
    if(newOrder === null) return;
    const newNote = prompt('Catatan:', it.note || '');
    if(newNote === null) return;

    it.customer = newCust.trim();
    it.orderId  = newOrder.trim();
    it.note     = newNote.trim();
    save(); render();
    toast('✓ Data diperbarui', 'ok');
  }
});

/* =========================================================
   FILTER & SEARCH
   ========================================================= */
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  currentFilter = tab.dataset.filter;
  render();
});

document.getElementById('searchBox').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

/* =========================================================
   EXPORT / BACKUP / RESTORE
   ========================================================= */
document.getElementById('btnExport').addEventListener('click', () => {
  if(data.length === 0){ toast('Belum ada data untuk diexport', 'err'); return; }
  const headers = ['Username','Nama Pelanggan','No. Pesanan','Dibuat','Berakhir','Status','Sisa Hari','Catatan'];
  const rows = data.map(it => {
    const st = getStatus(it);
    return [
      it.username,
      it.customer || '',
      it.orderId || '',
      fmtFull(it.createdAt),
      fmtFull(it.expiresAt),
      STATUS_LABEL[st],
      daysLeft(it.expiresAt),
      it.note || ''
    ];
  });
  const csv = [headers, ...rows]
    .map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(','))
    .join('\n');

  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
  downloadBlob(blob, `username-backup-${new Date().toISOString().slice(0,10)}.csv`);
  toast('✓ CSV berhasil diunduh', 'ok');
});

document.getElementById('btnBackup').addEventListener('click', () => {
  const payload = { data, counter };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  downloadBlob(blob, `username-backup-${new Date().toISOString().slice(0,10)}.json`);
  toast('✓ Backup JSON berhasil', 'ok');
});

document.getElementById('btnRestore').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', e => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try{
      const parsed = JSON.parse(ev.target.result);
      // Dukung format lama (array) maupun format baru ({data, counter})
      const imported = Array.isArray(parsed) ? parsed : (parsed.data || []);
      const importedCounter = Array.isArray(parsed) ? 0 : (parsed.counter || 0);

      if(!Array.isArray(imported)) throw new Error('Format salah');
      const valid = imported.filter(x => x && x.username);
      if(valid.length === 0) throw new Error('Tidak ada data valid');

      if(confirm(`Import ${valid.length} data? Data saat ini (${data.length}) akan digabungkan.`)){
        const existing = new Set(data.map(x => x.username.toLowerCase()));
        let added = 0;
        let maxNum = counter;

        valid.forEach(x => {
          if(!existing.has(x.username.toLowerCase())){
            if(!x.id) x.id = uid();
            if(!x.createdAt) x.createdAt = new Date().toISOString();
            if(!x.expiresAt) x.expiresAt = addMonths(x.createdAt, x.durationMonths || 3).toISOString();
            const n = x.number || extractNumber(x.username);
            if(n) x.number = n;
            data.push(x);
            existing.add(x.username.toLowerCase());
            if(n && n > maxNum) maxNum = n;
            added++;
          }
        });

        // Pastikan counter tidak turun & menghormati counter dari backup
        counter = Math.max(counter, maxNum, importedCounter);
        localStorage.setItem(COUNTER_KEY, String(counter));

        save(); render(); updatePreview();
        toast(`✓ ${added} data diimport`, 'ok');
      }
    }catch(err){
      toast('Gagal import: ' + err.message, 'err');
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* =========================================================
   INIT
   ========================================================= */
load();
render();
updatePreview();
document.getElementById('fCustomer').focus();

setInterval(render, 60000);
</script>
</body>
